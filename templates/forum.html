<!DOCTYPE html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Forum</title></head>
<body>
  <p>Inloggad som {{ username }} | <a href="/logout">Logga ut</a></p>
  <h1>Forum för fårskallar</h1>

  <form method="post">
    <textarea name="content" rows="4" cols="50" required></textarea><br>
    <button>Posta</button>
  </form>

  <hr>
  {% for post in posts %}
    <div>
      <strong>{{ post.username }}</strong>
      <small>{{ post.created_at.strftime("%Y-%m-%d %H:%M") }}</small>
      <p>{{ post.content }}</p>
    </div>
  {% else %}
    <p>Inga inlägg ännu.</p>
  {% endfor %}
</body>
</html>
