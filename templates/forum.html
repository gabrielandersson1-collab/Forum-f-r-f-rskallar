<!DOCTYPE html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Forum</title></head>
<body>
  <p>Inloggad som {{ username }} | <a href="/logout">Logga ut</a></p>
  <h1>Forum för fårskallar</h1>

  <h2>Ny tråd</h2>
  <form method="post">
    <input name="title" placeholder="Rubrik" size="50" required>
    <button>Skapa tråd</button>
  </form>

  <h2>Trådar</h2>
  <ul>
    {% for t in topics %}
      <li>
       <a href="{{ url_for('main.topic', topic_id=t.id) }}">{{ t.title }}</a>
        av {{ t.username }}
        <small>{{ t.created_at.strftime("%Y-%m-%d %H:%M") }}</small>
      </li>
    {% else %}
      <li>Inga trådar ännu. Skapa den första!</li>
    {% endfor %}
  </ul>
</body>
</html>
